services:
  postgres:
    image: postgres:16-alpine
    container_name: gwx_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gwx
    ports:
      - "5433:5432"
    volumes:
      - gwx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gwx_pgdata:
